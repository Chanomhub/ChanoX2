name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.2.5)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      LPACK_ENCRYPTION_KEY: ${{ secrets.LPACK_ENCRYPTION_KEY }}
      LPACK_SECURITY_KEY: ${{ secrets.LPACK_SECURITY_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Install dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: npm ci

      - name: Bake secrets into source
        shell: node {0}
        run: |
          const fs = require('fs');
          const files = ['electron/main.cjs', 'src/libs/sdk.ts'];
          const replacements = {
            '__LPACK_SECURITY_KEY__': process.env.LPACK_SECURITY_KEY,
            '__LPACK_ENCRYPTION_KEY__': process.env.LPACK_ENCRYPTION_KEY,
            '__VITE_SUPABASE_URL__': process.env.VITE_SUPABASE_URL,
            '__VITE_SUPABASE_ANON_KEY__': process.env.VITE_SUPABASE_ANON_KEY
          };
          
          files.forEach(file => {
            if (!fs.existsSync(file)) {
              console.log(` Skip: ${file} not found`);
              return;
            }
            let content = fs.readFileSync(file, 'utf8');
            let changed = false;
            for (const [placeholder, value] of Object.entries(replacements)) {
              if (value && content.includes(placeholder)) {
                content = content.split(placeholder).join(value);
                changed = true;
              }
            }
            if (changed) {
              fs.writeFileSync(file, content);
              console.log(` Baked secrets into ${file}`);
            }
          });

      - name: Build application
        run: npm run build

      - name: Install Flatpak dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
          flatpak install --user -y flathub org.electronjs.Electron2.BaseApp//24.08

      - name: Build Electron (Linux)
        if: matrix.platform == 'linux'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm run electron:build -- --linux AppImage deb tar.gz flatpak rpm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (Windows)
        if: matrix.platform == 'win'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: npm run electron:build -- --win nsis portable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Electron (macOS)
        if: matrix.platform == 'mac'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: npm run electron:build -- --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChanoX2-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.flatpak
            release/latest*.yml
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Base Tag
        id: base_tag
        shell: bash
        run: |
          CURRENT_TAG=${GITHUB_REF#refs/tags/}
          echo "Current Tag: $CURRENT_TAG"
          MAJOR_SUMMARY=""
          
          # Check if it's a Major release (e.g., v2.0.0)
          if [[ "$CURRENT_TAG" =~ ^v[0-9]+\.0\.0$ ]]; then
            MAJOR=$(echo $CURRENT_TAG | cut -d. -f1 | sed 's/v//')
            PREV_MAJOR=$((MAJOR - 1))
            FROM_TAG="v${PREV_MAJOR}.0.0"
            echo "Detected Major release. Base: $FROM_TAG"
            
            # Gather all Minor tags from the previous cycle (e.g., v1.1.0, v1.2.0...)
            MINOR_TAGS=$(git tag -l "v${PREV_MAJOR}.[0-9]*.0" --sort=v:refname)
            MAJOR_SUMMARY="### 🏆 Journey through the v${PREV_MAJOR}.x era\n\nThis major release consolidates all improvements from the following milestones:\n"
            for t in $MINOR_TAGS; do
              TAG_DATE=$(git log -1 --format=%ai $t 2>/dev/null | cut -d' ' -f1 || echo "unknown")
              # Get the first line of the tag message or the first commit if no tag message
              MSG=$(git tag -l --format='%(contents:subject)' $t)
              if [ -z "$MSG" ]; then
                MSG=$(git log -1 --format=%s $t)
              fi
              MAJOR_SUMMARY="${MAJOR_SUMMARY}- **$t** ($TAG_DATE): ${MSG}\n"
            done
            MAJOR_SUMMARY="${MAJOR_SUMMARY}\n---\n"
          
          # Default to previous tag in history
          else
            FROM_TAG=$(git describe --tags --abbrev=0 ${CURRENT_TAG}^ 2>/dev/null || echo "")
            echo "Detected release. Base: $FROM_TAG"
          fi
          
          echo "from_tag=$FROM_TAG" >> $GITHUB_OUTPUT
          # Use a multi-line output for the summary
          echo "major_summary<<EOF" >> $GITHUB_OUTPUT
          echo -e "$MAJOR_SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Release Notes & AI Summary
        id: release_notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .github/scripts/generate_release_notes.py \
            --current-tag "${{ github.ref_name }}" \
            --prev-tag "${{ steps.base_tag.outputs.from_tag }}" \
            --repo "${{ github.repository }}" \
            --output release_notes.md
          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.tar.gz
            artifacts/**/*.flatpak
            artifacts/**/latest*.yml
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}